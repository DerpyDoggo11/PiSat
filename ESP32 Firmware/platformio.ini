; ROVER brain firmware (src/main.cpp) -- runs on an ESP32-C3 Super Mini.
; Hosts the WiFi SoftAP, receives RTCM corrections from the base, feeds them to
; the PiSat rover GNSS, follows the GPS path and drives two ZS-X11H BLDC
; controllers. Talks to the PiSat RP2350 over UART on GPIO 20 (RX) / 21 (TX).
;
; Build/upload:  pio run -e c3_rover -t upload
[env:c3_rover]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Build only the rover brain. wifi_ap.cpp (the onboard-C3 SoftAP test) is left
; on disk but excluded so it doesn't clash with main.cpp's setup()/loop().
build_src_filter = +<*> -<wifi_ap.cpp>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; USB Serial console on the C3 super mini
    -DCORE_DEBUG_LEVEL=1
