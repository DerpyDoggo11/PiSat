; PiSat ESP32-C3 Super Mini WiFi bridges. Four build roles:
;
;   [env:main]        MAIN rover bridge (default): hosts SoftAP "PiSat-RTK".
;                     Telemetry :8888, commands/$GP2/path :8889, RTCM/$PSDG :2101.
;                     Transparent bridge to the rover RP2350 (src/main.cpp).
;   [env:main_ntrip]  MAIN rover bridge in NTRIP mode (-DUSE_NTRIP=1): WiFi
;                     station + NTRIP client pulling real RTCM3 from a caster.
;   [env:client]      CLIENT PiSat uplink (src/bridge_sta.cpp): STA that forwards
;                     its RP2350's $GP2 position to the rover command server :8889.
;   [env:base]        BASE PiSat uplink (src/bridge_sta.cpp): STA that forwards
;                     $PSDG/RTCM3 corrections to the rover :2101.
;
; Wiring: C3 GPIO20 (RX) <- RP2350 GP0 ; C3 GPIO21 (TX) -> RP2350 GP1 ; common GND.
; Build/upload:  pio run -e main -t upload   (or -e client / -e base / -e main_ntrip)

[env]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; USB Serial console on the C3 super mini
    -DCORE_DEBUG_LEVEL=1

[env:main]
build_src_filter = +<main.cpp>

[env:main_ntrip]
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DUSE_NTRIP=1

[env:client]
build_src_filter = +<bridge_sta.cpp>
build_flags = ${env.build_flags} -DUPLINK_PORT=8889

[env:base]
build_src_filter = +<bridge_sta.cpp>
build_flags = ${env.build_flags} -DUPLINK_PORT=2101
