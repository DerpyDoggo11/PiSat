; PiSat RTK BASE bridge -- runs on an ESP32-C3 Super Mini.
;
; Reads RTCM3 corrections from the base PiSat's RP2350 (built with [env:base])
; on a UART, joins the rover's WiFi SoftAP, and streams those corrections to
; the rover over TCP. The rover is the access point + server; this is a client.
;
; Build/upload:  pio run -e c3_base -t upload
[env:c3_base]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; USB Serial for debug on the C3 super mini
    -DCORE_DEBUG_LEVEL=1
